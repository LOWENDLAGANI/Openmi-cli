[workspace]
resolver = "2"
members = [
    "crates/openmi-platform",
    "crates/openmi-checkpoints",
    "crates/openmi-core",
    "crates/openmi-cli",
]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
flate2 = "1"
futures-util = "0.3"
ignore = "0.4"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

openmi-platform = { path = "crates/openmi-platform" }
openmi-checkpoints = { path = "crates/openmi-checkpoints" }
openmi-core = { path = "crates/openmi-core" }
