<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Sign in to authorize your Openmi CLI session with Google, GitHub, or email." />
  <title>Sign in — Openmi CLI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="page">
    <div class="card">
      <nav class="top-nav" aria-label="Primary navigation">
        <a href="/" class="nav-link">Dashboard</a>
        <a href="/pay" class="nav-link">Passes &amp; Billing</a>
        <a href="/verify" class="nav-link is-active">CLI Login</a>
      </nav>

      <div class="brand">
        <span class="brand-mark" aria-hidden="true">O</span>
        <div>
          <h1>Authorize Openmi CLI</h1>
          <p class="subtitle" id="card-subtitle">Sign in to connect your terminal session.</p>
        </div>
      </div>

      <div class="code-box">
        <label for="device-code" class="code-label">One-time device code</label>
        <input
          id="device-code"
          class="code-input"
          type="text"
          placeholder="XXXX-XXXX"
          maxlength="12"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <!-- Signed-out view -->
      <section id="auth-view" class="section">
        <div class="oauth-stack">
          <button type="button" class="btn btn-oauth" id="btn-google">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.2-2.27H12v4.3h6.44a5.5 5.5 0 0 1-2.39 3.61v3h3.87c2.26-2.08 3.57-5.15 3.57-8.64Z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.93-2.91l-3.87-3c-1.07.72-2.44 1.14-4.06 1.14-3.12 0-5.77-2.11-6.72-4.95H1.28v3.1A12 12 0 0 0 12 24Z"/>
              <path fill="#FBBC05" d="M5.28 14.28A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.56.38-2.28v-3.1H1.28A12 12 0 0 0 0 12c0 1.94.46 3.77 1.28 5.38l4-3.1Z"/>
              <path fill="#EA4335" d="M12 4.77c1.76 0 3.34.61 4.58 1.8l3.44-3.44C17.94 1.19 15.23 0 12 0A12 12 0 0 0 1.28 6.62l4 3.1C6.23 6.88 8.88 4.77 12 4.77Z"/>
            </svg>
            Continue with Google
          </button>

          <button type="button" class="btn btn-oauth" id="btn-github">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.69-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.79 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.77.11 3.06.74.8 1.19 1.83 1.19 3.09 0 4.41-2.69 5.39-5.26 5.67.42.36.79 1.07.79 2.16 0 1.56-.01 2.82-.01 3.2 0 .31.21.68.8.56A11.52 11.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
            </svg>
            Continue with GitHub
          </button>
        </div>

        <div class="divider"><span>or continue with email</span></div>

        <form id="email-form" class="email-form">
          <div class="field">
            <label for="email-input">Email</label>
            <input id="email-input" type="email" class="input" placeholder="you@example.com" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="password-input">Password</label>
            <input id="password-input" type="password" class="input" placeholder="••••••••" required minlength="6" autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary" id="email-submit">Sign in with Email</button>
        </form>

        <p class="mode-switch">
          <span id="mode-prompt">Don't have an account?</span>
          <button type="button" class="link-btn" id="toggle-mode">Create account</button>
        </p>
      </section>

      <!-- Signed-in approval view -->
      <section id="approve-view" class="section hidden">
        <div class="account-pill">
          <div class="account-info">
            <span class="account-label">Signed in as</span>
            <strong class="account-email" id="signed-in-email">—</strong>
          </div>
          <button type="button" class="link-btn" id="btn-signout">Switch account</button>
        </div>

        <div class="approve-actions">
          <button type="button" class="btn btn-primary" id="btn-approve">Approve Device</button>
          <button type="button" class="btn btn-secondary" id="btn-deny">Deny</button>
        </div>
      </section>

      <!-- Done view -->
      <section id="done-view" class="section hidden">
        <div class="done-box" id="done-box">
          <strong id="done-title">Device Approved</strong>
          <p id="done-desc">You can close this tab and return to your terminal.</p>
        </div>
      </section>

      <div id="status-msg" class="status-msg hidden" role="alert"></div>
    </div>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
