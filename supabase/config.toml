# Supabase CLI project configuration (partial). Only function-level overrides live here.
project_id = "umjlmqeghfrfpduhkits"

# Disable gateway-level legacy JWT verification on these functions:
# - `cli-auth` accepts unauthenticated /start, /poll, and browser GET /verify requests
#   (and validates the user's token itself on /approve via `admin.auth.getUser`).
# - `models` is publicly readable (returns the model catalog even before login).
# - `credits` and `chat` validate the user's Supabase access token explicitly via
#   `admin.auth.getUser(bearer)` so publishable keys and CORS preflights work cleanly.
[functions.cli-auth]
verify_jwt = false

[functions.models]
verify_jwt = false

[functions.credits]
verify_jwt = false

[functions.chat]
verify_jwt = false

[functions.payments]
verify_jwt = false

[functions.providers]
verify_jwt = false
