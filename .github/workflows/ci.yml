name: CI

on:
  push:
    branches: [main, "cli/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  no-openssl:
    name: Verify rustls-only (no openssl-sys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check dependency tree excludes openssl-sys
        run: |
          if cargo tree --workspace | grep -q "openssl-sys"; then
            echo "ERROR: openssl-sys detected in dependency tree; Termux requires rustls-only."
            exit 1
          fi

  security-audit:
    name: Security audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace
      - name: Smoke test CLI
        run: cargo run -p openmi-cli -- smoke-test

  js-ts-check:
    name: Validate JS & Supabase Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check admin-panel & auth-web
        run: |
          for f in admin-panel/api/*.js auth-web/app.js; do
            node --check "$f"
          done
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check Supabase Edge Functions
        run: |
          for f in supabase/functions/*/index.ts; do
            deno check "$f"
          done
