name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-matrix:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: openmi.exe
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: openmi
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin: openmi
            archive: tar.gz
          # x86_64 macOS is cross-compiled on the arm64 runner (Intel runner images are retired).
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: openmi
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: openmi
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build -p openmi-cli --release --target ${{ matrix.target }}
      - name: Package (Unix tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          ASSET="openmi-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "dist/$ASSET" "${{ matrix.bin }}"
          (cd dist && shasum -a 256 "$ASSET" > "$ASSET.sha256" || sha256sum "$ASSET" > "$ASSET.sha256")
      - name: Package (Windows zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $asset = "openmi-${{ matrix.target }}.zip"
          Compress-Archive -Path "target\${{ matrix.target }}\release\${{ matrix.bin }}" -DestinationPath "dist\$asset"
          $hash = (Get-FileHash "dist\$asset" -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Out-File -Encoding ascii "dist\$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: openmi-${{ matrix.target }}
          path: dist/*

  build-termux-aarch64:
    name: Build Android/Termux (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Locate Android NDK linker
        run: |
          NDK_ROOT="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
      - name: Build openmi for aarch64-linux-android
        run: cargo build -p openmi-cli --release --target aarch64-linux-android
      - name: Package Termux artifact
        run: |
          mkdir -p dist
          ASSET="openmi-aarch64-linux-android.tar.gz"
          tar -C target/aarch64-linux-android/release -czf "dist/$ASSET" openmi
          (cd dist && sha256sum "$ASSET" > "$ASSET.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: openmi-aarch64-linux-android
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: [build-matrix, build-termux-aarch64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate combined SHA256SUMS.txt
        working-directory: artifacts
        run: sha256sum openmi-*.tar.gz openmi-*.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
