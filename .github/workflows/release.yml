name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-termux-aarch64:
    name: Build Android/Termux (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Locate Android NDK linker
        id: ndk
        run: |
          NDK_ROOT="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
      - name: Build openmi for aarch64-linux-android
        run: cargo build -p openmi-cli --release --target aarch64-linux-android
      - name: Package Termux artifact
        run: |
          mkdir -p dist
          tar -C target/aarch64-linux-android/release -czf dist/openmi-aarch64-linux-android.tar.gz openmi
          sha256sum dist/openmi-aarch64-linux-android.tar.gz > dist/openmi-aarch64-linux-android.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: openmi-aarch64-linux-android
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: [build-termux-aarch64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate combined SHA256SUMS.txt
        working-directory: artifacts
        run: sha256sum *.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
